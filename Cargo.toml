[package]
name = "tamil_tokenizer"
version = "0.1.0"
edition = "2021"
description = "A high-performance BPE tokenizer for Tamil text"
license = "MIT"

[lib]
name = "tamil_tokenizer"
path = "lib.rs"

[[bin]]
name = "encode"
path = "encode.rs"

[dependencies]
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rustc-hash = "1"