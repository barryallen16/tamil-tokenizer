name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --release

  # Two trainer defects shipped because their regression tests were weak:
  # the merge heap discarded stale entries (25% of the token count) and id
  # minting walked a hash map (models differed run to run). Both are now
  # covered, but a test that no longer catches its own bug is worse than no
  # test, so this job re-introduces each defect and requires the suite to fail.
  trainer-defects:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: suite is green to begin with
        run: cargo test --release

      - name: drop stale heap entries instead of re-pushing them
        run: |
          python3 - <<'EOF'
          import re, pathlib
          p = pathlib.Path("trainer.rs")
          s = p.read_text()
          before = s
          s = s.replace(
              """                        self.pair_heap.push(HeapEntry {
                            key: entry.key,
                            count: current_freq,
                        });""",
              "",
          )
          assert s != before, "heap re-push pattern not found"
          p.write_text(s)
          EOF

      - name: the oracle must catch it
        run: |
          if cargo test --release trainer_matches_brute_force > /dev/null 2>&1; then
            echo "::error::stale heap entries no longer fail the oracle"
            exit 1
          fi
          echo "oracle correctly rejects the reintroduced heap defect"

      - name: restore
        run: git checkout -- trainer.rs

      - name: mint token ids while walking the hash map
        run: |
          python3 - <<'EOF'
          import pathlib
          p = pathlib.Path("trainer.rs")
          s = p.read_text()
          before = s
          s = s.replace(
              "unique_words.sort_by(|a, b| a.0.cmp(&b.0));",
              "unique_words.reverse();",
          )
          assert s != before, "sort line not found"
          p.write_text(s)
          EOF

      - name: the determinism test must catch it
        run: |
          if cargo test --release training_is_reproducible > /dev/null 2>&1; then
            echo "::error::non-deterministic id minting no longer fails the test"
            exit 1
          fi
          echo "determinism test correctly rejects hash-order id minting"

  python-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Four measurement scripts were added without CI coverage, and one of
      # them had a positional-call bug that only surfaced after uploading two
      # large files. Syntax and import checks catch that class cheaply.
      - name: compile every script
        run: python -m compileall -q scripts/

      - name: every script is runnable
        run: |
          python - <<'EOF'
          import ast, pathlib, sys
          bad = []
          for p in sorted(pathlib.Path("scripts").glob("*.py")):
              src = p.read_text(encoding="utf-8")
              tree = ast.parse(src, str(p))
              has_main = any(
                  isinstance(n, ast.FunctionDef) and n.name == "main"
                  for n in ast.walk(tree)
              )
              # Not every script uses main(); several run at module scope behind
              # an `if __name__` guard. Either is fine, having neither is not.
              if not has_main and '__name__' not in src:
                  bad.append(f"{p}: no entry point")
          if bad:
              print("::error::" + "; ".join(bad))
              sys.exit(1)
          print(f"checked {len(list(pathlib.Path('scripts').glob('*.py')))} scripts")
          EOF