[package]
name = "tamil_tokenizer"
version = "0.1.0"
edition = "2021"
description = "A high-performance BPE tokenizer for Tamil text"
license = "MIT"

[lib]
name = "tamil_tokenizer"
path = "lib.rs"

[[bin]]
name = "main"
path = "main.rs"

[[bin]]
name = "vocabcount"
path = "vocabcount.rs"

[[bin]]
name = "train"
path = "train.rs"

[[bin]]
name = "encode"
path = "encode.rs"

[[bin]]
name = "decode"
path = "decode.rs"

[[bin]]
name = "benchmark"
path = "benchmark.rs"

[[bin]]
name = "score"
path = "score.rs"

[[bin]]
name = "bench"
path = "bench.rs"

[[bin]]
name = "encode_lines"
path = "encode_lines.rs"

[[bin]]
name = "export_hf"
path = "export_hf.rs"

[[bin]]
name = "test_special_tokens"
path = "test_special_tokens.rs"

[[bin]]
name = "bench_encode"
path = "bench_encode.rs"

[[bin]]
name = "bench_speed"
path = "bench_speed.rs"

[dependencies]
regex = "1"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rustc-hash = "1"
ahash = { version = "0.8", features = ["serde"] }
aho-corasick = "1"

[profile.release]
opt-level = 3
lto = true

[[bin]]
name = "profile_encode"
path = "profile_encode.rs"
