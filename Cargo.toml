[package]
name = "tamil_tokenizer"
version = "0.1.0"
edition = "2021"
description = "A high-performance BPE tokenizer for Tamil text"
license = "MIT"

[dependencies]
regex = "1"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rustc-hash = "1"
ahash = { version = "0.8", features = ["serde"] }

[profile.release]
opt-level = 3
lto = true
